# The layout text of site

# ----- Commons label -----

layout:
  post: Příspěvek
  category: Kategorie
  tag: Štítek

# The tabs of sidebar
tabs:
  # format: <filename_without_extension>: <value>
  home: Domů
  categories: Kategorie
  tags: Štítky
  archives: Archivy
  about: O mně

# the text displayed in the search bar & search results
search:
  hint: hledat
  cancel: Zrušit
  no_results: Ups! Žádný výsledek nenalezen.

panel:
  lastmod: Nedávno aktualizováno
  trending_tags: Trendy štítky
  toc: Obsah

copyright:
  # Shown at the bottom of the post
  license:
    template: Autor tento příspěvek zveřejnil pod licencí :LICENSE_NAME.
    name: CC BY 4.0
    link: https://creativecommons.org/licenses/by/4.0/

  # Displayed in the footer
  brief: Některá práva vyhrazena.
  verbose: >-
    Pokud není uvedeno jinak, autor zveřejňuje příspěvky na tomto webu
    pod licencí Creative Commons Uveďte původ 4.0 Mezinárodní (CC BY 4.0).

meta: Web používá :PLATFORM s motivem :THEME.

not_found:
  statement: Omlouváme se, tato adresa URL se nám ztratila nebo odkazuje na něco, co neexistuje.

notification:
  update_found: Je tu nový obsah
  update: Aktualizovat

theme:
  light: Světlý
  dark: Tmavý
  system: Systém

# ----- Posts related labels -----

post:
  written_by: Od
  posted: Zveřejněno
  updated: Aktualizováno
  words: slov
  pageview_measure: zhlédnutí
  read_time:
    unit: min
    prompt: čtení
  edit: Upravit tento příspěvek
  relate_posts: Další čtení
  share: Sdílet
  button:
    next: Novější
    previous: Starší
    copy_code:
      succeed: Zkopírováno!
    share_link:
      title: Kopírovat odkaz
      succeed: Odkaz zkopírován!

# Date time format.
# See: <http://strftime.net/>, <https://day.js.org/docs/en/display/format>
df:
  post:
    strftime: "%b %e, %Y"
    dayjs: "ll"
  archives:
    strftime: "%b"
    dayjs: "MMM"

# categories page
categories:
  category_measure: kategorie
  post_measure:
    singular: příspěvek
    plural: příspěvky
